basePath: /api/v1
definitions:
  model.APIResponse:
    properties:
      data: {}
      errors:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      message:
        type: string
    type: object
  model.AddCompanyMemberRequest:
    properties:
      email:
        example: jane@acme.com
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.CompanyRole'
        enum:
        - admin
        - member
        example: member
    required:
    - email
    - role
    type: object
  model.AddMemberRequest:
    properties:
      email:
        example: jane@acme.com
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.Role'
        enum:
        - admin
        - editor
        - viewer
        example: editor
    required:
    - email
    - role
    type: object
  model.AuditAction:
    enum:
    - create
    - update
    - delete
    - rollback
    type: string
    x-enum-varnames:
    - AuditActionCreate
    - AuditActionUpdate
    - AuditActionDelete
    - AuditActionRollback
  model.AuditEntry:
    properties:
      action:
        $ref: '#/definitions/model.AuditAction'
      actorEmail:
        type: string
      actorUserId:
        type: string
      after:
        type: object
      before:
        type: object
      companyId:
        type: string
      flagId:
        type: string
      flagsetId:
        type: string
      id:
        description: |-
          ID is a bigserial rather than a UUID: audit rows are append-only and
          ordering by ID matches insertion order.
        type: integer
      metadata:
        type: object
      occurredAt:
        type: string
      targetId:
        type: string
      targetType:
        $ref: '#/definitions/model.AuditTargetType'
      teamId:
        type: string
    type: object
  model.AuditTargetType:
    enum:
    - company
    - company_member
    - team
    - team_member
    - flagset
    - api_key
    - flag
    type: string
    x-enum-varnames:
    - AuditTargetCompany
    - AuditTargetCompanyMember
    - AuditTargetTeam
    - AuditTargetTeamMember
    - AuditTargetFlagset
    - AuditTargetAPIKey
    - AuditTargetFlag
  model.Company:
    properties:
      createdAt:
        type: string
      description:
        type: string
      displayName:
        type: string
      id:
        type: string
      updatedAt:
        type: string
    type: object
  model.CompanyMember:
    properties:
      companyId:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        description: = UserID; gives refine a row key
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/model.CompanyRole'
      userId:
        type: string
    type: object
  model.CompanyMembership:
    properties:
      companyDisplayName:
        type: string
      companyId:
        type: string
      role:
        $ref: '#/definitions/model.CompanyRole'
    type: object
  model.CompanyRole:
    enum:
    - admin
    - member
    type: string
    x-enum-varnames:
    - CompanyRoleAdmin
    - CompanyRoleMember
  model.CreateAPIKeyRequest:
    properties:
      label:
        example: relay-proxy-prod
        type: string
    required:
    - label
    type: object
  model.CreateCompanyRequest:
    properties:
      description:
        type: string
      displayName:
        example: Acme Corp
        type: string
    required:
    - displayName
    type: object
  model.CreateFlagRequest:
    properties:
      comment:
        example: initial rollout
        type: string
      name:
        example: new-checkout
        type: string
      payload:
        type: object
    required:
    - name
    - payload
    type: object
  model.CreateFlagsetRequest:
    properties:
      defaultTestingEvaluationContext:
        type: object
      description:
        type: string
      evaluationContextEnrichment:
        type: object
      exporters:
        type: object
      fileFormat:
        allOf:
        - $ref: '#/definitions/model.FileFormat'
        enum:
        - yaml
        - json
        - toml
        example: yaml
      name:
        example: production
        type: string
      notifiers:
        type: object
      pollingIntervalMs:
        example: 60000
        type: integer
      retrievers:
        type: object
    required:
    - name
    type: object
  model.CreateTeamRequest:
    properties:
      adminEmail:
        example: jane@acme.com
        type: string
      description:
        type: string
      name:
        example: Payments
        type: string
    required:
    - adminEmail
    - name
    type: object
  model.DisableFlagRequest:
    properties:
      disabled:
        description: Pointer so a missing field is rejected instead of silently enabling
          the flag.
        example: true
        type: boolean
    required:
    - disabled
    type: object
  model.EvaluateFlagRequest:
    properties:
      evaluationContext:
        $ref: '#/definitions/model.EvaluationContextInput'
    type: object
  model.EvaluationContextInput:
    properties:
      attributes:
        additionalProperties: {}
        type: object
      targetingKey:
        type: string
    type: object
  model.EvaluationResult:
    properties:
      cacheable:
        type: boolean
      errorCode:
        type: string
      errorDetails:
        type: string
      failed:
        type: boolean
      flagType:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      reason:
        type: string
      trackEvents:
        type: boolean
      value: {}
      variationType:
        type: string
      version:
        type: string
    type: object
  model.FileFormat:
    enum:
    - yaml
    - json
    - toml
    type: string
    x-enum-varnames:
    - FileFormatYAML
    - FileFormatJSON
    - FileFormatTOML
  model.Flag:
    properties:
      createdAt:
        type: string
      currentVersion:
        type: integer
      currentVersionId:
        type: string
      disabled:
        description: |-
          Disabled is the source of truth for the flag's on/off state; payloads may
          not set a top-level disable (see ValidateFlagPayload).
        type: boolean
      flagsetId:
        type: string
      id:
        type: string
      name:
        type: string
      payload:
        type: object
      updatedAt:
        type: string
    type: object
  model.FlagInstance:
    properties:
      currentVersion:
        type: integer
      disabled:
        type: boolean
      distribution:
        additionalProperties:
          format: float64
          type: number
        description: |-
          Distribution is the default rule's served split (variation name → percent)
          summarized for the list; a single served variation reads as {name: 100}.
        type: object
      flagsetId:
        type: string
      flagsetName:
        type: string
      id:
        type: string
      name:
        type: string
      owner:
        type: string
      progressiveRollout:
        allOf:
        - $ref: '#/definitions/model.ProgressiveSummary'
        description: |-
          Progressive is set only when the default rule is a progressive rollout; the
          list renders it as a rocket + initial→end indicator instead of a bar.
      tags:
        description: |-
          Tags are the flag's user-authored labels (from payload.metadata.tags), used
          by the webui to render tag chips and filter the list.
        items:
          type: string
        type: array
      targetingRuleCount:
        description: |-
          TargetingRuleCount is the number of targeting rules on the flag (0 means the
          flag serves its default rule only).
        type: integer
      type:
        type: string
      updatedAt:
        type: string
      variations:
        description: |-
          Variations are the flag's variation names in payload document order; the
          webui colors the distribution bar by each name's index in this list.
        items:
          type: string
        type: array
    type: object
  model.FlagListItem:
    properties:
      currentVersion:
        type: integer
      disabled:
        type: boolean
      flagsetId:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  model.FlagVersion:
    properties:
      comment:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      createdByName:
        type: string
      flagId:
        type: string
      id:
        type: string
      payload:
        type: object
      versionNumber:
        type: integer
    type: object
  model.Flagset:
    properties:
      apiKeyCount:
        description: |-
          APIKeyCount, FlagCount and EnabledFlagCount are computed by the query;
          their db tags name the SELECT aliases.
        type: integer
      createdAt:
        type: string
      defaultTestingEvaluationContext:
        description: |-
          DefaultTestingEvaluationContext is the evaluation context proposed by
          default in the UI's flag test/evaluate panel for flags in this flagset.
        type: object
      description:
        type: string
      enabledFlagCount:
        type: integer
      evaluationContextEnrichment:
        description: |-
          EvaluationContextEnrichment is a free-form object merged into every
          evaluation context for flags in this flagset (enrichment value wins on
          key collision).
        type: object
      exporters:
        type: object
      fileFormat:
        $ref: '#/definitions/model.FileFormat'
      flagCount:
        type: integer
      id:
        type: string
      name:
        type: string
      notifiers:
        type: object
      pollingIntervalMs:
        type: integer
      retrievers:
        type: object
      teamId:
        type: string
      updatedAt:
        type: string
    type: object
  model.FlagsetAPIKey:
    properties:
      apiKey:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      createdByName:
        description: CreatedByName is joined from users; nil once the creator is deleted.
        type: string
      flagsetId:
        type: string
      id:
        type: string
      label:
        type: string
    type: object
  model.MeResponse:
    properties:
      company:
        $ref: '#/definitions/model.CompanyMembership'
      membership:
        items:
          $ref: '#/definitions/model.TeamMembership'
        type: array
      user:
        $ref: '#/definitions/model.User'
    type: object
  model.PaginatedResponse-model_AuditEntry:
    properties:
      data:
        items:
          $ref: '#/definitions/model.AuditEntry'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  model.PaginatedResponse-model_FlagInstance:
    properties:
      data:
        items:
          $ref: '#/definitions/model.FlagInstance'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  model.PaginatedResponse-model_FlagListItem:
    properties:
      data:
        items:
          $ref: '#/definitions/model.FlagListItem'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  model.PaginatedResponse-model_FlagVersion:
    properties:
      data:
        items:
          $ref: '#/definitions/model.FlagVersion'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  model.ProgressiveSummary:
    properties:
      endVariation:
        type: string
      from:
        type: number
      initialVariation:
        type: string
      to:
        type: number
    type: object
  model.Role:
    enum:
    - admin
    - editor
    - viewer
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleEditor
    - RoleViewer
  model.RollbackRequest:
    properties:
      comment:
        type: string
    type: object
  model.Team:
    properties:
      companyId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  model.TeamMember:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        description: = UserID; gives refine a row key
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/model.Role'
      teamId:
        type: string
      userId:
        type: string
    type: object
  model.TeamMembership:
    properties:
      role:
        $ref: '#/definitions/model.Role'
      teamId:
        type: string
      teamName:
        type: string
    type: object
  model.UIConfig:
    properties:
      monoCompany:
        type: boolean
    type: object
  model.UpdateCompanyMemberRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/model.CompanyRole'
        enum:
        - admin
        - member
        example: admin
    required:
    - role
    type: object
  model.UpdateCompanyRequest:
    properties:
      description:
        type: string
      displayName:
        type: string
    type: object
  model.UpdateFlagRequest:
    properties:
      comment:
        example: raise rollout to 50%
        type: string
      payload:
        type: object
    required:
    - payload
    type: object
  model.UpdateFlagsetRequest:
    properties:
      defaultTestingEvaluationContext:
        type: object
      description:
        type: string
      evaluationContextEnrichment:
        type: object
      exporters:
        type: object
      fileFormat:
        enum:
        - yaml
        - json
        - toml
        example: yaml
        type: string
      name:
        type: string
      notifiers:
        type: object
      pollingIntervalMs:
        example: 60000
        type: integer
      retrievers:
        type: object
    type: object
  model.UpdateMemberRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/model.Role'
        enum:
        - admin
        - editor
        - viewer
        example: viewer
    required:
    - role
    type: object
  model.UpdateTeamRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  model.User:
    properties:
      avatar:
        type: string
      companyId:
        description: CompanyID and CompanyRole are both set or both nil; read the
          role via Role().
        type: string
      companyRole:
        $ref: '#/definitions/model.CompanyRole'
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      isSuperAdmin:
        type: boolean
      lastLoginAt:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Source-of-truth API for managing GO Feature Flag flagsets, flags, teams, and audit history.
    Every route except GET /config and POST /auth/logout requires the HttpOnly `goff_mgmt_session`
    session cookie set by the OIDC login (GET /auth/login, outside this base path;
    see docs/reference/api.md)
    and answers 401 without it. Errors use the `{message, errors?}` envelope (model.APIResponse).
  title: GO Feature Flag Management API
  version: 0.1.0
paths:
  /audit:
    get:
      parameters:
      - description: filter by company id (narrows; another company's id yields nothing)
        in: query
        name: companyId
        type: string
      - description: filter by team id
        in: query
        name: teamId
        type: string
      - description: filter by flagset id
        in: query
        name: flagsetId
        type: string
      - description: filter by flag id
        in: query
        name: flagId
        type: string
      - description: filter by actor user id
        in: query
        name: actorId
        type: string
      - description: filter by action
        enum:
        - create
        - update
        - delete
        - rollback
        in: query
        name: action
        type: string
      - description: RFC3339 lower bound, inclusive (e.g. 2026-10-01T00:00:00Z)
        format: date-time
        in: query
        name: from
        type: string
      - description: RFC3339 upper bound, inclusive (e.g. 2026-10-31T23:59:59Z)
        format: date-time
        in: query
        name: to
        type: string
      - default: 1
        description: page
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: items per page
        in: query
        maximum: 200
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PaginatedResponse-model_AuditEntry'
        "400":
          description: bad from/to, page/pageSize or action
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: List audit log entries with filters
      tags:
      - audit
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Logout (clears the session cookie; no session required)
      tags:
      - auth
  /auth/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.MeResponse'
              type: object
      summary: Get current user + memberships
      tags:
      - auth
  /companies:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Company'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: List all companies (super admin only)
      tags:
      - companies
    post:
      consumes:
      - application/json
      parameters:
      - description: company
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateCompanyRequest'
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Company'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
        "409":
          description: a company already exists (mono company mode)
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: Create a company (super admin only)
      tags:
      - companies
  /companies/{companyId}:
    delete:
      parameters:
      - description: company id
        in: path
        name: companyId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: Delete a company (super admin only; cascades to its teams, flagsets,
        flags, versions and API keys)
      tags:
      - companies
    get:
      parameters:
      - description: company id
        in: path
        name: companyId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Company'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: Get company
      tags:
      - companies
    patch:
      consumes:
      - application/json
      parameters:
      - description: company id
        in: path
        name: companyId
        required: true
        type: string
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UpdateCompanyRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Company'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: Update a company (company admin)
      tags:
      - companies
  /companies/{companyId}/members:
    get:
      parameters:
      - description: company id
        in: path
        name: companyId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.CompanyMember'
                  type: array
              type: object
      summary: List company members
      tags:
      - companies
    post:
      consumes:
      - application/json
      parameters:
      - description: company id
        in: path
        name: companyId
        required: true
        type: string
      - description: member to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.AddCompanyMemberRequest'
      responses:
        "200":
          description: 'existing member: role updated'
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.CompanyMember'
              type: object
        "201":
          description: member added
          schema:
            allOf:
            - $ref: '#/definitions/model.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.CompanyMember'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: no user with this email (users of other companies included)
          schema:
            $ref: '#/definitions/model.APIResponse'
        "409":
          description: demoting the last company admin
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: Add a member to a company, or set the role of an existing member (company
        admin)
      tags:
      - companies
  /companies/{companyId}/members/{uid}:
    delete:
      parameters:
      - description: company id
        in: path
        name: companyId
        required: true
        type: string
      - description: user id
        in: path
        name: uid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: malformed id
          schema:
            $ref: '#/definitions/model.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
        "409":
          description: removing the last company admin
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: Remove a member from a company (company admin; also drops their team
        roles there)
      tags:
      - companies
    patch:
      consumes:
      - application/json
      parameters:
      - description: company id
        in: path
        name: companyId
        required: true
        type: string
      - description: user id
        in: path
        name: uid
        required: true
        type: string
      - description: new role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UpdateCompanyMemberRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse'
        "409":
          description: demoting the last company admin
          schema:
            $ref: '#/definitions/model.APIResponse'
      summary: Update a company member's role (company admin)
      tags:
      - companies
  /companies/{companyId}/teams:
    get:
      parameters:
      - description: company id
        in: path
        name: companyId
        required: true
        type: string
