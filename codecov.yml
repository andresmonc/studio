# Go coverage reports use the module path, which differs from the repo layout.
fixes:
  - "github.com/gofeatureflag/studio/::"

# The global statuses otherwise fall back to Codecov's defaults (target: auto,
# no threshold), which fail any PR that lowers coverage at all.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
      - type: patch
        target: 80%
  individual_flags:
    - name: server
      paths:
        - server/
    - name: webui
      paths:
        - webui/

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true

# Test-only helpers: exercised by other packages' tests, so per-package Go
# coverage always reports them at 0%.
ignore:
  - "server/management/internal/testutil/**"
  # Generated by swag; CI checks it is up to date instead.
  - "server/management/docs/**"
  - "webui/src/test/**"
  # shadcn components copied in as-is; covered by their stories, not unit tests.
  - "webui/src/components/ui/**"
  # Copied from refine's shadcn registry, same as components/ui.
  - "webui/src/components/refine-ui/**"
  # App bootstrap wiring (providers and routes), exercised end to end, not by unit tests.
  - "webui/src/App.tsx"
  - "webui/src/index.tsx"
  - "**/*.stories.tsx"
